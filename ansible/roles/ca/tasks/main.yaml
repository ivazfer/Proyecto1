- name: Crear el directorio de la CA
  ansible.builtin.file:
    path: "{{ ca_dir }}"
    state: directory
    mode: '0700'

- name: Clave privada de la CA
  community.crypto.openssl_privatekey:
    path: "{{ ca_dir }}/ca.key"
    mode: '0600'

- name: Petición de certificado de la CA
  community.crypto.openssl_csr:
    path: "{{ ca_dir }}/ca.csr"
    privatekey_path: "{{ ca_dir }}/ca.key"
    common_name: "{{ ca_nombre }}"
    use_common_name_for_san: false
    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true

- name: Certificado de la CA (autofirmado, 10 años)
  community.crypto.x509_certificate:
    path: "{{ ca_dir }}/ca.crt"
    csr_path: "{{ ca_dir }}/ca.csr"
    privatekey_path: "{{ ca_dir }}/ca.key"
    provider: selfsigned
    selfsigned_not_after: "+3650d"
