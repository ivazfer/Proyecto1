# --- Iniciador iSCSI ---
- name: Instalar open-iscsi
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - open-iscsi

- name: Ver los targets ya descubiertos
  community.general.open_iscsi:
    show_nodes: true
  register: nodos

- name: Descubrir el target (solo la primera vez)
  community.general.open_iscsi:
    portal: "{{ ip_datos_san }}"
    discover: true
  when: iscsi_iqn not in nodos.nodes

- name: Conectar al target con CHAP y conexión automática al arrancar
  community.general.open_iscsi:
    portal: "{{ ip_datos_san }}"
    target: "{{ iscsi_iqn }}"
    node_auth: CHAP
    node_user: "{{ iscsi_usuario }}"
    node_pass: "{{ iscsi_password }}"
    login: true
    auto_node_startup: true

- name: Esperar a que aparezca el disco
  ansible.builtin.wait_for:
    path: "{{ iscsi_dispositivo }}"
    timeout: 30

# --- Formato y montaje ---
- name: Formatear el disco iSCSI (solo si no tiene sistema de ficheros)
  community.general.filesystem:
    fstype: ext4
    dev: "{{ iscsi_dispositivo }}"
  register: formateo

- name: Obtener el UUID del disco
  ansible.builtin.command: blkid -s UUID -o value {{ iscsi_dispositivo }}
  register: iscsi_uuid
  changed_when: false

- name: Crear la unidad de montaje de systemd
  ansible.builtin.template:
    src: var-lib-mariadb.mount.j2
    dest: /etc/systemd/system/var-lib-mariadb.mount
    owner: root
    group: root
    mode: '0644'

- name: Crear el directorio de configuración de mariadb.service
  ansible.builtin.file:
    path: /etc/systemd/system/mariadb.service.d
    state: directory
    mode: '0755'

- name: MariaDB espera al montaje iSCSI
  ansible.builtin.copy:
    src: mariadb-iscsi.conf
    dest: /etc/systemd/system/mariadb.service.d/iscsi.conf
    owner: root
    group: root
    mode: '0644'

- name: Montar /var/lib/mariadb y activarlo al arrancar
  ansible.builtin.systemd_service:
    name: var-lib-mariadb.mount
    state: started
    enabled: true
    daemon_reload: true

- name: Quitar lost+found del disco recién formateado
  ansible.builtin.file:
    path: /var/lib/mariadb/lost+found
    state: absent
  when: formateo.changed

- name: Instalar MariaDB
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - mariadb-server
    - python3-mysqldb

- name: MariaDB escucha solo en la red de datos
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address'
    line: 'bind-address = {{ ip_datos_bd }}'
  notify: restart mariadb

- name: Crear la base de datos
  community.mysql.mysql_db:
    name: "{{ bd_nombre }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  register: bd_creada

- name: Copiar el esquema de la aplicación
  ansible.builtin.copy:
    src: schema.sql
    dest: /tmp/schema.sql
    mode: '0644'

- name: Crear las tablas (solo si la base de datos es nueva)
  community.mysql.mysql_db:
    name: "{{ bd_nombre }}"
    state: import
    target: /tmp/schema.sql
    login_unix_socket: /run/mysqld/mysqld.sock
  when: bd_creada.changed

- name: Crear el usuario (solo desde la IP de web)
  community.mysql.mysql_user:
    name: "{{ bd_usuario }}"
    password: "{{ bd_password }}"
    host: "{{ ip_datos_web }}"
    priv: "{{ bd_nombre }}.*:ALL"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
