- name: Esperar a que termine cloud-init
  ansible.builtin.command: cloud-init status --wait
  register: cloudinit
  changed_when: false
  failed_when: cloudinit.rc not in [0, 2]

- name: Actualizar el sistema
  ansible.builtin.apt:
    update_cache: true
    upgrade: true
    lock_timeout: 600

- name: Instalar paquetes comunes
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - curl
    - nano
    - mariadb-client

- name: Endurecer SSH
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: restart ssh
