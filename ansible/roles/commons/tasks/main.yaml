- name: Esperar a que termine cloud-init
  ansible.builtin.command: cloud-init status --wait
  register: cloudinit
  changed_when: false
  failed_when: cloudinit.rc not in [0, 2]

- name: Actualizar el sistema
  ansible.builtin.apt:
    update_cache: true
    upgrade: true

- name: Instalar paquetes comunes
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - curl
    - nano
