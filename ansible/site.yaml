- name: Configuración común
  hosts: all
  become: true
  roles:
    - commons

- name: Configurar servidor de almacenamiento (SAN)
  hosts: servidores_san
  become: true
  roles:
    - san

- name: Configurar servidor de base de datos
  hosts: servidores_bd
  become: true
  roles:
    - bd

- name: Configurar servidor web
  hosts: servidores_web
  become: true
  roles:
    - web

- name: Crear la autoridad certificadora (en el equipo de control)
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - ca

- name: Configurar el proxy inverso
  hosts: servidores_proxy
  become: true
  roles:
    - proxy
